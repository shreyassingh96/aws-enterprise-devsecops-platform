loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
    
  storage:
    type: s3
    bucketNames:
      chunks: lokis3bucketlogs 
      ruler: lokis3bucketlogs 
      admin: lokis3bucketlogs 
    s3:
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      s3ForcePathStyle: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

# Minimal deployment for single-zone dev environment
deploymentMode: SingleBinary
singleBinary:
  replicas: 1

# Disable distributed components for SingleBinary mode
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

test:
  enabled: false

# Enable gateway for dashboard access
gateway:
  enabled: true

# Cleanup old logs
tableManager:
  retention_deletes_enabled: true
  retention_period: 336h # 14 days
