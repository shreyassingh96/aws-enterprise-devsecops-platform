alertmanager:
  persistentVolume:
    enabled: true
    size: 2Gi
server:
  persistentVolume:
    enabled: true
    size: 8Gi
  retention: 15d
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
pushgateway:
  enabled: false
